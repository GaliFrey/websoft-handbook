[project]
site_name = "WebSoft Handbook"
site_description = "Практические рецепты, разборы и руководства по WebSoft"
docs_dir = "docs"
site_dir = "site"
# site_url и repo_url будут заданы после выбора места публикации.
nav = [
  { "Главная" = "index.md" },
  { "Рецепты" = "recipes/index.md" },
  { "Разборы" = [
    { "Все разборы" = "explanations/index.md" },
    { "ZIP-архивы через Websoft.Zip" = [
      { "Обзор" = "explanations/websoft-zip/index.md" },
      { "Сборка 434" = "explanations/websoft-zip/434/index.md" },
      { "Сборка 906" = "explanations/websoft-zip/906/index.md" },
    ] },
    { "Регулярные выражения через WebSoft.RegExp" = "explanations/websoft-regexp/index.md" },
    { "Преобразование XQuery в SQL" = [
      { "Обзор" = "explanations/xquery-to-sql/index.md" },
      { "434 + MSSQL" = "explanations/xquery-to-sql/434-mssql/index.md" },
    ] },
  ] },
  { "Руководства" = [
    { "Все руководства" = "guides/index.md" },
    { "WebSocket в WebTutor" = [
      { "Обзор" = "guides/websockets/index.md" },
      { "Сборка 434" = [
        { "Обзор версии" = "guides/websockets/434/index.md" },
        { "Подготовка и подключение" = "guides/websockets/434/connection.md" },
        { "Отправка сообщений" = "guides/websockets/434/messages.md" },
        { "Группы клиентов" = "guides/websockets/434/groups.md" },
        { "Закрытие соединений" = "guides/websockets/434/closing.md" },
      ] },
      { "Сборка 906" = [
        { "Обзор версии" = "guides/websockets/906/index.md" },
        { "Подготовка и подключение" = "guides/websockets/906/connection.md" },
        { "Отправка сообщений" = "guides/websockets/906/messages.md" },
        { "Группы клиентов" = "guides/websockets/906/groups.md" },
        { "Теги" = "guides/websockets/906/tags.md" },
        { "Закрытие соединений" = "guides/websockets/906/closing.md" },
      ] },
      { "Тестовый HTML-клиент" = "guides/websockets/ws-client.md" },
    ] },
  ] },
]

[project.theme]
variant = "modern"
language = "ru"
font = false
features = [
  "navigation.tabs",
  "navigation.top",
  "content.code.copy",
  "content.tabs.link",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "material/brightness-7"
toggle.name = "Переключить на тёмную тему"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "material/brightness-4"
toggle.name = "Переключить на светлую тему"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
